name: build-push-dockerhub
# Policy-proof: no marketplace actions (pure shell) so org Actions policies
# that restrict external actions cannot block it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "backend/knowledge/**", "data/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        run: git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}" repo
      - name: docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: build & push
        run: |
          cd repo
          IMG="${{ secrets.DOCKERHUB_USERNAME }}/sih26166"
          docker build -f deploy/Dockerfile \
            -t "$IMG:latest" -t "$IMG:${{ github.sha }}" .
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"
          echo "pushed: $IMG:latest"
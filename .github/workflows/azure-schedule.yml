name: azure-schedule
# 07:00 IST wake (min 1 replica) / 19:00 IST sleep (min 0, scale-to-zero).
# IST is UTC+5:30 with no DST -> 01:30 UTC / 13:30 UTC, stable year-round.
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      state:
        description: "on (wake) or off (sleep)"
        default: "on"
        type: choice
        options: ["on", "off"]

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: resolve state
        id: st
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "min=$( [ "${{ github.event.inputs.state }}" = "on" ] && echo 1 || echo 0 )" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "min=1" >> "$GITHUB_OUTPUT"
          else
            echo "min=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDS }}
      - name: apply min-replicas
        run: |
          az containerapp update -n sih26166-backend -g sih26166-rg \
            --min-replicas ${{ steps.st.outputs.min }} \
            --query "properties.scale.minReplicas" -o tsv
          echo "sih26166-backend min-replicas -> ${{ steps.st.outputs.min }}"
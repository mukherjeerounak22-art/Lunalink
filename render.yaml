# Render.com Blueprint - deploys the FULL SIH26166 backend with zero
# dashboard clicking: render.com -> New -> Blueprint -> point at this
# repo -> Apply.  All five baked scenes, the ONNX model, the TMC/IIRS
# library caches AND the per-product layer caches (metric_dem.npy /
# minerals.npz, ~880 KB) are committed, so /layers serves the complete
# 5-layer experience (SFS + OPTICAL + METRIC + MINERALS + SFS-METRIC)
# with zero big rasters.  /health must report learned_model_loaded: true.
#
# NASA strips for BRAND-NEW uploads are fetched on demand from the
# public Kaggle dataset: set KAGGLE_LRO_DATASET (one-time ~3 GB per
# instance, memmap-read so 512 MB RAM is fine).  Without it, uploads
# fall back to a simulated second pass (baked scenes unaffected).
services:
  - type: web
    name: sih26166-backend
    runtime: python
    plan: free            # free tier spins down after ~15 min idle — the UI auto-wakes it (status badge); repo keep-alive.yml can prevent sleep entirely (set WAKE_URL secret) (see DEMO_INSTRUCTIONS.md §14)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # optional integrations — set these in the Render dashboard, never in git:
      # GOOGLE_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
      # UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, SENTRY_DSN_BACKEND,
      # KAGGLE_LRO_DATASET (owner/slug of the public strip-library dataset)